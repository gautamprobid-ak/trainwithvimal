# docker compose up --build
# then: docker compose exec api python manage.py seed_all
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trainwithvimal}
      MYSQL_USER: ${MYSQL_USER:-twv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-twv}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [mysql_data:/var/lib/mysql]
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    environment: &backend-env
      MYSQL_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    env_file: .env
    environment: *backend-env
    command: celery -A config worker -l info
    depends_on: [api]

  beat:
    build: .
    env_file: .env
    environment: *backend-env
    command: celery -A config beat -l info
    depends_on: [api]

volumes:
  mysql_data:
  media:
